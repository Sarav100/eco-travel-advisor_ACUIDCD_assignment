version: "3.1"
rules:
- rule: Greet and show privacy notice
  steps:
  - intent: greet
  - action: utter_greet
  - action: utter_privacy_notice

- rule: Activate trip form
  steps:
  - intent: plan_trip
  - action: trip_form
  - active_loop: trip_form

- rule: Submit trip form -> search, score, rank
  condition:
  - active_loop: trip_form
  steps:
  - action: trip_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_search_options
  - action: action_carbon_estimate
  - action: action_rank_options

- rule: User asks for a human at any time
  steps:
  - intent: request_human
  - action: action_handover_to_human

- rule: NLU fallback -> two-stage clarification
  steps:
  - intent: nlu_fallback
  - action: action_two_stage_fallback

- rule: Out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Location shared (GPS or typed)
  steps:
  - intent: inform_location
  - action: action_carbon_estimate
